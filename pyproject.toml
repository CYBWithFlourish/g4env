[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "g4env"
version = "1.0.0"
description = "Offline-first environment configuration and secret-leak auditing CLI with optional local Gemma reasoning."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "CYBWithFlourish" }]
keywords = ["security", "secrets", "env", "audit", "dotenv", "ollama", "gemma", "static-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
# The Ollama provider talks to the local Ollama HTTP API. It works with the
# standard library alone; the official client is used automatically when
# installed but is never required.
ollama = ["ollama>=0.3.0"]
# The Gemini provider talks to the hosted Gemini API. It works with the
# standard library alone; the official SDK is used automatically when
# installed but is never required.
gemini = ["google-genai>=1.0"]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
g4env = "g4env.cli:main"

[project.urls]
Homepage = "https://github.com/CYBWithFlourish/g4env"
Repository = "https://github.com/CYBWithFlourish/g4env"
Issues = "https://github.com/CYBWithFlourish/g4env/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/g4env"]

[tool.hatch.build.targets.sdist]
include = ["src/g4env", "tests", "README.md", "LICENSE", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/g4env"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "RUF"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.isort]
# Keep ``from x import (A as B, C as D)`` in a single statement.
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["src/g4env"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
